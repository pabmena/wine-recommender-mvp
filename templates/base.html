<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descorcha.IA - Recomendador de Vinos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background-image: linear-gradient(to bottom, rgba(7, 4, 4, 0.85) 0%, rgba(7, 4, 4, 0.96) 100%), url('/static/img/vineyards/mendoza-valle-uco.jpg'); background-size: cover; background-position: center; background-attachment: fixed; min-height: 100vh; color: #fcf9f9;">
    <header style="text-align: center; padding: 1.5rem 0; border-bottom: 1px solid rgba(255,255,255,0.03);">
        <a href="/commercial">
            <img src="{{ url_for('static', filename='img/commercial/logotipo-descorcha-ia.jpg') }}" alt="Descorcha.IA" style="height: 55px; border-radius: 4px; vertical-align: middle;">
        </a>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer style="text-align: center; padding: 2rem 0; border-top: 1px solid rgba(255,255,255,0.03); margin-top: 3rem;">
        <p>&copy; 2026 Descorcha.IA - Recomendador Inteligente de Vinos basado en tu Paladar</p>
        <p style="color: rgba(207, 171, 52, 0.7); font-size: 0.82rem; margin-top: 0.5rem; font-style: italic;">
            Descorcha.IA promueve el consumo responsable de bebidas alcohólicas. Prohibida su venta a menores de 18 años. Beber con moderación.
        </p>
    </footer>
</body>
</html>
